<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NTK Creator Command</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --surface: #ffffff;
      --text: #141210;
      --muted: #5c564c;
      --accent: #9e7318;
      --border: #e2d9c8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --surface: #111115;
        --text: #f5f1e8;
        --muted: #9f988c;
        --accent: #d4af37;
        --border: rgba(255, 248, 232, 0.12);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      width: 380px;
      padding: 32px 28px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.22);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      display: block;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .bar {
      height: 4px;
      width: 100%;
      border-radius: 999px;
      background: rgba(159, 152, 140, 0.22);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: var(--accent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="9" fill="#111115" />
      <rect x="2.25" y="2.25" width="31.5" height="31.5" rx="7" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1" />
      <path d="M8.5 23.5V12.5L14.5 23.5V12.5M17.2 12.5H22.2M19.7 12.5V23.5M24.4 12.5V23.5M24.4 18L28.5 12.5M24.4 18L28.5 23.5" stroke="#D4AF37" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h1>NTK Creator Command</h1>
    <p>Starting your private Creator Atelier…</p>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
